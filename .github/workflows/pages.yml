name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pinned LMSS.owl only changes when _config.yml does, so key on it.
      - name: Cache the pinned ontology
        uses: actions/cache@v4
        with:
          path: .cache
          key: lmss-owl-${{ hashFiles('_config.yml') }}

      - name: Build the hand-written pages
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Writes ~18k tag pages straight into _site. Deliberately not Jekyll
      # pages: Liquid-rendering that many files takes hours, this takes seconds.
      - name: Generate the tag tree, API and search index
        run: python3 scripts/build_lmss.py --out _site

      - name: Check the output
        run: python3 scripts/check_build.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
